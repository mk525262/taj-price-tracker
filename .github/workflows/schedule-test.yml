name: Schedule Registration Test

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm schedule event
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "scheduled_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
