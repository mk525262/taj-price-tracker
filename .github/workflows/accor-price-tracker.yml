name: Accor Ibis Jaipur Price Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - "accor_tracker.py"
      - ".github/workflows/accor-price-tracker.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: accor-ibis-jaipur
  cancel-in-progress: false

jobs:
  check-accor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check Ibis Jaipur price
        run: python accor_tracker.py
      - name: Sync latest price to Google Sheet
        env:
          ACCOR_SHEET_WEBHOOK: https://script.google.com/macros/s/AKfycbzB1sWbowoGzodfC4o0juShbv4s-tydzkFHsWFwJsPxZYSIpBf072oWXtmk9l8bc5o/exec
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import json, os, requests

          path = Path("Accor_Ibis_Jaipur_Price_History.xlsx")
          wb = load_workbook(path, data_only=True)
          ws = wb.active
          row = [ws.cell(ws.max_row, c).value for c in range(1, 12)]

          payload = {
              "timestamp": str(row[0]),
              "checkIn": str(row[1]),
              "checkOut": str(row[2]),
              "adults": row[3],
              "rooms": row[4],
              "composition": str(row[5]),
              "hotel": str(row[6]),
              "memberPrice": row[7],
              "standardPrice": row[8],
              "priceBasis": str(row[9]),
              "eligible": str(row[10]),
          }

          r = requests.post(os.environ["ACCOR_SHEET_WEBHOOK"], json=payload, timeout=30)
          r.raise_for_status()
          result = r.json()
          if not result.get("success"):
              raise RuntimeError(f"Google Sheet sync failed: {result}")
          print("Google Sheet sync successful:", json.dumps(result))
          PY
      - name: Send alert only when price changes
        env:
          ACCOR_TELEGRAM_BOT_TOKEN: ${{ secrets.ACCOR_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import os, requests, time

          path = Path("Accor_Ibis_Jaipur_Price_History.xlsx")
          wb = load_workbook(path, data_only=True)
          ws = wb.active

          if ws.max_row < 3:
              print("Not enough history for price-change alert.")
              raise SystemExit(0)

          previous = [ws.cell(ws.max_row - 1, c).value for c in range(1, 12)]
          current = [ws.cell(ws.max_row, c).value for c in range(1, 12)]
          previous_price = float(previous[7])
          current_price = float(current[7])

          if previous_price == current_price:
              print(f"No member-price change: ₹{current_price:,.0f}. No alert sent.")
              raise SystemExit(0)

          if current_price <= 4900:
              alert_count = 20
              title = "🚨🚨🚨 ACCOR ₹4,900 ALERT 🚨🚨🚨"
          else:
              alert_count = 5
              title = "🚨 ACCOR PRICE CHANGE 🚨"

          message = (
              f"{title}\n\n"
              f"₹{current_price:,.0f} / STAY\n"
              f"Previous: ₹{previous_price:,.0f} / stay\n\n"
              "🏨 ibis Jaipur City Centre\n"
              "📅 2026-09-20 → 2026-09-22\n"
              "👤 4 Adults | 2 Rooms\n"
              "🛏️ Composition: 2 + 2 adults\n"
              "🏷️ Member rate\n\n"
              f"Standard: ₹{float(current[8]):,.0f} / stay\n\n"
              "Source: Official Accor rates page"
          )

          token = os.environ["ACCOR_TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for i in range(alert_count):
              r = requests.post(url, data={"chat_id": "348797661", "text": message}, timeout=30)
              r.raise_for_status()
              print(f"Price-change alert {i + 1}/{alert_count} sent.")
              if i < alert_count - 1:
                  time.sleep(1)
          PY
      - name: Commit Excel price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Accor_Ibis_Jaipur_Price_History.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Update Ibis Jaipur price history"
          git pull --rebase origin main
          git push

# separate-accor-bot
