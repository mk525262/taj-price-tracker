name: Accor Ibis Jaipur Price Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - "accor_tracker.py"
      - ".github/workflows/accor-price-tracker.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: accor-ibis-jaipur
  cancel-in-progress: false

jobs:
  check-accor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Ibis Jaipur price
        env:
          TAJ_TELEGRAM_BOT_TOKEN: ${{ secrets.TAJ_TELEGRAM_BOT_TOKEN }}
        run: python accor_tracker.py

      - name: Commit Excel price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Accor_Ibis_Jaipur_Price_History.xlsx
          git diff --cached --quiet || git commit -m "Update Ibis Jaipur price history"
          git push
