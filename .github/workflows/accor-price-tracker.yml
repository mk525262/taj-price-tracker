name: Accor Ibis Jaipur Price Tracker

on:
  workflow_dispatch:
  push:
    paths:
      - "accor_tracker.py"
      - ".github/workflows/accor-price-tracker.yml"
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check-accor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Discover Accor availability API
        run: python accor_tracker.py

      - name: Upload Accor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accor-debug
          path: accor_debug.json
          if-no-files-found: ignore
