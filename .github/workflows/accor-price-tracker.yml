name: Accor Ibis Jaipur Price Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accor-ibis-jaipur
  cancel-in-progress: false

jobs:
  check-accor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check Ibis Jaipur price
        run: python accor_tracker.py
      - name: Sync latest price to Google Sheet
        env:
          ACCOR_SHEET_WEBHOOK: https://script.google.com/macros/s/AKfycbzB1sWbowoGzodfC4o0juShbv4s-tydzkFHsWFwJsPxZYSIpBf072oWXtmk9l8bc5o/exec
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import json, os, requests

          path = Path("Accor_Ibis_Jaipur_Price_History.xlsx")
          wb = load_workbook(path, data_only=True)
          ws = wb.active
          row = [ws.cell(ws.max_row, c).value for c in range(1, 14)]

          payload = {
              "timestamp": str(row[0]),
              "checkIn": str(row[1]),
              "checkOut": str(row[2]),
              "adults": row[3],
              "rooms": row[4],
              "composition": str(row[5]),
              "hotel": str(row[6]),
              "memberPrice": row[7],
              "standardPrice": row[8],
              "priceBasis": str(row[9]),
              "eligible": str(row[10]),
              "nextDateMemberPrice": row[11],
              "nextDateStandardPrice": row[12],
          }

          r = requests.post(os.environ["ACCOR_SHEET_WEBHOOK"], json=payload, timeout=30)
          r.raise_for_status()
          result = r.json()
          if not result.get("success"):
              raise RuntimeError(f"Google Sheet sync failed: {result}")
          print("Google Sheet sync successful:", json.dumps(result))
          PY
      - name: Send alert only when price changes
        env:
          ACCOR_TELEGRAM_BOT_TOKEN: ${{ secrets.ACCOR_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import os, requests, time

          path = Path("Accor_Ibis_Jaipur_Price_History.xlsx")
          wb = load_workbook(path, data_only=True)
          ws = wb.active

          if ws.max_row < 3:
              print("Not enough history for price-change alert.")
              raise SystemExit(0)

          previous = [ws.cell(ws.max_row - 1, c).value for c in range(1, 14)]
          current = [ws.cell(ws.max_row, c).value for c in range(1, 14)]

          previous_price = float(previous[7])
          current_price = float(current[7])
          previous_next_price = float(previous[11]) if previous[11] is not None else None
          current_next_price = float(current[11]) if current[11] is not None else None

          target_changed = previous_price != current_price
          next_date_changed = (
              previous_next_price is not None
              and current_next_price is not None
              and previous_next_price != current_next_price
          )
          manual_test = os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch"

          if not manual_test and not target_changed and not next_date_changed:
              print(f"No price change: 20 Sep ₹{current_price:,.0f}; 21 Sep ₹{current_next_price:,.0f}. No alert sent.")
              raise SystemExit(0)

          if manual_test:
              alert_count = 1
              title = "🧪 ACCOR TEST PRICE"
          elif current_price < 4500 or (current_next_price is not None and current_next_price < 4500):
              alert_count = 10
              title = "🚨🚨🚨 ACCOR ₹4,500 ALERT 🚨🚨🚨"
          else:
              alert_count = 5
              title = "🚨 ACCOR PRICE CHANGE 🚨"

          next_standard_text = (
              f"₹{float(current[12]):,.0f} / stay" if current[12] is not None else "N/A"
          )

          message = (
              f"{title}\n\n"
              f"💰 ₹{current_price:,.0f} / STAY | ₹{current_next_price:,.0f} / STAY\n\n"
              "🏨 ibis Jaipur City Centre\n"
              "👤 4 Adults | 2 Rooms\n"
              "🛏️ Composition: 2 + 2 adults\n"
              "🏷️ Member rate\n\n"
              f"📅 20 Sep → 22 Sep: ₹{current_price:,.0f} / stay\n"
              f"📅 21 Sep → 23 Sep: ₹{current_next_price:,.0f} / stay\n\n"
              f"Previous 20 Sep → 22 Sep: ₹{previous_price:,.0f} / stay\n"
              f"Previous 21 Sep → 23 Sep: ₹{previous_next_price:,.0f} / stay\n\n"
              f"Standard 20 Sep → 22 Sep: ₹{float(current[8]):,.0f} / stay\n"
              f"Standard 21 Sep → 23 Sep: {next_standard_text}\n\n"
              "Source: Official Accor rates page"
          )

          token = os.environ["ACCOR_TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          for i in range(alert_count):
              r = requests.post(url, data={"chat_id": "348797661", "text": message}, timeout=30)
              r.raise_for_status()
              print(f"Telegram message {i + 1}/{alert_count} sent.")
              if i < alert_count - 1:
                  time.sleep(1)
          PY
      - name: Commit Excel price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp Accor_Ibis_Jaipur_Price_History.xlsx /tmp/Accor_Ibis_Jaipur_Price_History.xlsx
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/Accor_Ibis_Jaipur_Price_History.xlsx Accor_Ibis_Jaipur_Price_History.xlsx
          git add Accor_Ibis_Jaipur_Price_History.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Update Ibis Jaipur price history"
          git push origin HEAD:main

# separate-accor-bot
