name: Accor Daily Price Messages

on:
  schedule:
    # 4:00 AM IST = 22:30 UTC (previous day)
    - cron: "30 22 * * *"
    # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"
    # 1:00 PM IST = 07:30 UTC
    - cron: "30 7 * * *"
    # 5:00 PM IST = 11:30 UTC
    - cron: "30 11 * * *"
    # 6:00 PM IST = 12:30 UTC
    - cron: "30 12 * * *"
    # 9:00 PM IST = 15:30 UTC
    - cron: "30 15 * * *"
    # 11:00 PM IST = 17:30 UTC
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-daily-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install openpyxl requests
      - name: Send scheduled Accor price message
        env:
          ACCOR_TELEGRAM_BOT_TOKEN: ${{ secrets.ACCOR_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          import os, requests

          path = Path("Accor_Ibis_Jaipur_Price_History.xlsx")
          if not path.exists():
              raise RuntimeError("Accor price history Excel file not found.")

          wb = load_workbook(path, data_only=True)
          ws = wb.active
          if ws.max_row < 2:
              raise RuntimeError("Accor price history has no price data yet.")

          row = [ws.cell(ws.max_row, c).value for c in range(1, 12)]
          member_price = float(row[7])
          standard_price = float(row[8])

          message = (
              f"₹{member_price:,.0f} / STAY\n"
              "ACCOR DAILY PRICE UPDATE\n\n"
              "🏨 ibis Jaipur City Centre\n"
              "📅 2026-09-20 → 2026-09-22\n"
              "👤 4 Adults | 2 Rooms\n"
              "🛏️ Composition: 2 + 2 adults\n"
              "🏷️ Member rate\n\n"
              f"Standard: ₹{standard_price:,.0f} / stay\n\n"
              "Source: Official Accor rates page"
          )

          token = os.environ["ACCOR_TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          r = requests.post(url, data={"chat_id": "348797661", "text": message}, timeout=30)
          r.raise_for_status()
          print("Scheduled daily Accor message sent.")
          PY
