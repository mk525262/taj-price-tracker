name: Taj 5m Schedule Watchdog

on:
  workflow_dispatch:
  schedule:
    # Run 1 minute after the main 5-minute cadence.
    - cron: "1-59/5 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check Taj freshness and recover missed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import json
          import subprocess
          from pathlib import Path

          path = Path("Taj_Price_History.csv")
          if not path.exists():
              print("No Taj history file yet; watchdog will dispatch the main workflow.")
              stale = True
          else:
              with path.open(encoding="utf-8", newline="") as f:
                  rows = list(csv.reader(f))
              if len(rows) < 2:
                  stale = True
              else:
                  raw = rows[-1][0].strip()
                  ts = dt.datetime.strptime(raw, "%Y-%m-%d %H:%M:%S").replace(
                      tzinfo=dt.timezone(dt.timedelta(hours=5, minutes=30))
                  )
                  now = dt.datetime.now(dt.timezone(dt.timedelta(hours=5, minutes=30)))
                  age = (now - ts).total_seconds()
                  stale = age > 480
                  print(f"Latest Taj row: {raw}; age={age:.0f}s; stale={stale}")

          runs_raw = subprocess.check_output(
              ["gh", "run", "list", "--workflow", "taj-excel-sync-5m.yml",
               "--limit", "20", "--json", "databaseId,status,createdAt"],
              text=True,
          )
          runs = json.loads(runs_raw)

          # A queued run can deadlock recovery because the main workflow uses
          # serialized concurrency. Only an actually running job is allowed to
          # block recovery. If freshness is stale and nothing is in progress,
          # cancel orphaned queued/requested runs and dispatch one clean run.
          in_progress = [r for r in runs if r.get("status") == "in_progress"]
          orphaned = [
              r for r in runs
              if r.get("status") in ("queued", "waiting", "requested")
          ]
          print(f"Main workflow in progress: {bool(in_progress)}")
          print(f"Main workflow queued/orphaned: {len(orphaned)}")

          if stale and not in_progress:
              for run in orphaned:
                  run_id = run.get("databaseId")
                  if run_id:
                      print(f"Cancelling orphaned queued Taj run: {run_id}")
                      subprocess.run(
                          ["gh", "run", "cancel", str(run_id)],
                          check=False,
                      )

              print("Freshness gap detected. Dispatching one clean Taj main workflow.")
              subprocess.check_call([
                  "gh", "workflow", "run", "taj-excel-sync-5m.yml", "--ref", "main"
              ])
          else:
              print("No recovery dispatch needed.")
          PY
