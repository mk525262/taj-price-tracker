name: Taj Excel History Sync 5m
# Taj browser/API capture reliability update (booking-flow test)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [taj_5m]

permissions:
  contents: write
  actions: write

concurrency:
  group: taj-excel-sync
  cancel-in-progress: false

jobs:
  sync-taj-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Start 5-minute cadence clock
        run: echo "CADENCE_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Taj check for price history
        run: xvfb-run -a python taj_tracker.py

      - name: Convert Taj timestamps to India time
        run: python taj_timezone_migration.py

      - name: Sync latest Taj price to Google Sheet
        if: ${{ success() }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from openpyxl import load_workbook

          webhook = "https://script.google.com/macros/s/AKfycbwq6S0UJXOjaz8UoI5AQbukGXi_4kWrllPEqTOZMReJCRwmhzc91N7esrdWb8LZ8g8y/exec"
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          row = list(ws.iter_rows(values_only=True))[-1]

          payload = {
              "timestamp": row[0],
              "twinMember": row[1],
              "twinStandard": row[2],
              "kingMember": row[3],
              "kingStandard": row[4],
              "lowestPrice": row[5],
              "lowestRoom": row[6],
              "lowestRateType": row[7],
          }

          data = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          print("Google Sheet response:", result)
          if not result.get("success"):
              raise SystemExit("Google Sheet sync failed: " + str(result))

          print("Latest Taj price synced to Google Sheet.")
          PY

      - name: Apply Taj Telegram alert rules
        if: always()
        env:
          TAJ_TELEGRAM_BOT_TOKEN: ${{ secrets.TAJ_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))

          if len(rows) < 2:
              print("Not enough history rows for Telegram.")
              raise SystemExit(0)

          current = rows[-1]
          previous = rows[-2] if len(rows) >= 3 else None
          current_prices = tuple(current[1:5])
          previous_prices = tuple(previous[1:5]) if previous else current_prices
          changed = previous is not None and current_prices != previous_prices

          current_lowest = float(current[5])
          previous_lowest = float(previous[5]) if previous and previous[5] is not None else None

          token = os.environ.get("TAJ_TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("TAJ_TELEGRAM_BOT_TOKEN is not configured.")

          # NORMAL UPDATE: exactly one message for each of 09:00, 13:00, 17:00,
          # 21:00 IST. If a run is missed, recover it for 30 minutes, once only.
          now_ist = dt.datetime.now(dt.timezone.utc).astimezone(
              dt.timezone(dt.timedelta(hours=5, minutes=30))
          )
          timed_slot = None
          for hour in (9, 13, 17, 21):
              if now_ist.hour == hour and now_ist.minute < 30:
                  timed_slot = now_ist.strftime("%Y-%m-%d") + f"-{hour:02d}"
                  break

          state_path = Path("taj_telegram_state.json")
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}

          timed_due = (
              timed_slot is not None
              and timed_slot != state.get("last_timed_slot")
          )

          # SPECIAL: crossing from >= ₹8,000 to < ₹8,000 sends 20 messages.
          crossed_8000 = (
              previous_lowest is not None
              and previous_lowest >= 8000
              and current_lowest < 8000
          )

          normal_message = (
              "💰 TAJ PRICE UPDATE\n\n"
              f"💰 LOWEST PRICE: ₹{int(current_lowest):,}\n\n"
              "🏨 Taj City Centre Gurugram\n"
              "📅 25 Dec 2026 → 26 Dec 2026\n"
              "👤 1 Guest | 1 Room\n\n"
          )
          for label, value in [
              ("🛏 Twin Member", current[1]),
              ("🛏 Twin Standard", current[2]),
              ("🛏 King Member", current[3]),
              ("🛏 King Standard", current[4]),
          ]:
              if value is not None:
                  normal_message += f"{label}: ₹{int(float(value)):,}\n"
          normal_message += f"🕐 {current[0]}"

          change_message = (
              "🚨 TAJ PRICE CHANGE\n\n"
              f"💰 LOWEST PRICE: ₹{int(current_lowest):,}\n\n"
              "🏨 Taj City Centre Gurugram\n"
              "📅 25 Dec 2026 → 26 Dec 2026\n"
              "👤 1 Guest | 1 Room\n\n"
          )
          for label, value in [
              ("🛏 Twin Member", current[1]),
              ("🛏 Twin Standard", current[2]),
              ("🛏 King Member", current[3]),
              ("🛏 King Standard", current[4]),
          ]:
              if value is not None:
                  change_message += f"{label}: ₹{int(float(value)):,}\n"
          change_message += f"🕐 {current[0]}"

          special_message = (
              "🚨🚨 TAJ SPECIAL PRICE ALERT 🚨🚨\n\n"
              "🏨 Taj City Centre Gurugram\n"
              "📅 25 Dec 2026 → 26 Dec 2026\n"
              "👤 1 Guest | 1 Room\n\n"
              f"💰 LOWEST PRICE: ₹{int(current_lowest):,}\n"
              "🔥 PRICE BELOW ₹8,000!\n"
              f"🕐 {current[0]}"
          )

          messages = []
          # The scheduled 4/day update is independent of price-change alerts.
          if timed_due:
              messages.append((normal_message, 1, "scheduled"))

          # Price-change alert is independent of the scheduled update.
          # Crossing below ₹8,000 has priority over the normal 5-message change alert.
          if crossed_8000:
              messages.append((special_message, 20, "special"))
          elif changed:
              messages.append((change_message, 5, "price-change"))

          if not messages:
              print("No Telegram alert due this run.")
              raise SystemExit(0)

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          for message, count, kind in messages:
              for i in range(count):
                  data = urllib.parse.urlencode({
                      "chat_id": "348797661",
                      "text": message,
                  }).encode("utf-8")
                  req = urllib.request.Request(url, data=data, method="POST")
                  with urllib.request.urlopen(req, timeout=20) as response:
                      response.read()
                  print(f"Telegram {kind} alert {i + 1}/{count} sent.")
                  if i < count - 1:
                      time.sleep(1)

          if timed_due:
              state["last_timed_slot"] = timed_slot
              state_path.write_text(
                  json.dumps(state, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              print(f"Recorded successful timed Telegram slot: {timed_slot}")
          PY

      - name: Export Taj Excel history to CSV
        run: |
          python - <<'PY'
          import csv
          from openpyxl import load_workbook
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          with open("Taj_Price_History.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  writer.writerow(row)
          PY

      - name: Queue next Taj check in 5 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          elapsed=$((now - CADENCE_START))
          remaining=$((300 - elapsed))

          if [ "$remaining" -gt 0 ]; then
            echo "Waiting ${remaining}s to preserve a 5-minute cadence..."
            sleep "$remaining"
          fi

          echo "Dispatching next Taj workflow run..."
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d '{"event_type":"taj_5m"}'

          echo "Next Taj workflow run queued."

      - name: Commit Taj price history
        if: always()
        run: |
          if [ ! -f Taj_Price_History.xlsx ]; then
            echo "No Taj Excel history created; nothing to commit."
            exit 0
          fi

          # Save the row produced by this run before refreshing from the latest main.
          cp Taj_Price_History.xlsx /tmp/Taj_Price_History.latest.xlsx
          if [ -f taj_last_state.json ]; then cp taj_last_state.json /tmp/taj_last_state.json; fi
          if [ -f taj_telegram_state.json ]; then cp taj_telegram_state.json /tmp/taj_telegram_state.json; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A queued run can start from an older commit while another run has
          # already pushed newer history. Rebase of binary XLSX files can conflict,
          # so refresh main first and merge this run's latest row into it.
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/taj_last_state.json ]; then cp /tmp/taj_last_state.json taj_last_state.json; fi
          if [ -f /tmp/taj_telegram_state.json ]; then cp /tmp/taj_telegram_state.json taj_telegram_state.json; fi

          python - <<'PY'
          from copy import copy
          from datetime import datetime
          from openpyxl import load_workbook

          latest = load_workbook("/tmp/Taj_Price_History.latest.xlsx", read_only=True, data_only=True)
          latest_ws = latest.active
          latest_row = list(latest_ws.iter_rows(values_only=True))[-1]

          base = load_workbook("Taj_Price_History.xlsx")
          ws = base.active

          base_last = ws.max_row
          existing_row = [ws.cell(base_last, col).value for col in range(1, len(latest_row) + 1)]

          def comparable(v):
              if isinstance(v, datetime):
                  return v.replace(tzinfo=None)
              if v is None:
                  return None
              return str(v)

          new_ts = comparable(latest_row[0])
          old_ts = comparable(existing_row[0]) if existing_row else None

          if old_ts is None:
              ws.append(list(latest_row))
              print("Added first Taj price row.")
          elif new_ts == old_ts:
              if [comparable(v) for v in latest_row] != [comparable(v) for v in existing_row]:
                  for col, value in enumerate(latest_row, start=1):
                      ws.cell(base_last, col).value = value
                  print("Updated the existing Taj row for the same timestamp.")
              else:
                  print("Latest Taj row already exists; no duplicate added.")
          else:
              target_row = base_last + 1
              ws.append(list(latest_row))
              for col in range(1, len(latest_row) + 1):
                  source = ws.cell(base_last, col)
                  target = ws.cell(target_row, col)
                  if source.has_style:
                      target._style = copy(source._style)
                  if source.number_format:
                      target.number_format = source.number_format
              print("Merged the fresh Taj row into current main history.")

          base.save("Taj_Price_History.xlsx")
          PY

          python - <<'PY'
          import csv
          from openpyxl import load_workbook
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          with open("Taj_Price_History.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  writer.writerow(row)
          PY

          git add Taj_Price_History.xlsx Taj_Price_History.csv .taj_timestamps_ist_migrated
          if [ -f taj_last_state.json ]; then git add taj_last_state.json; fi
          if [ -f taj_telegram_state.json ]; then git add taj_telegram_state.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update Taj price history"
          git push origin HEAD:main
