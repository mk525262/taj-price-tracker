name: Taj Excel History Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/taj-excel-sync.yml"
  schedule:
    # Run every 30 minutes. GitHub's schedule is UTC by default.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: taj-excel-sync
  cancel-in-progress: false

jobs:
  sync-taj-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Taj check for price history
        run: xvfb-run -a python taj_tracker.py

      - name: Convert Taj timestamps to India time
        run: python taj_timezone_migration.py

      - name: Sync latest Taj price to Google Sheet
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from openpyxl import load_workbook

          webhook = "https://script.google.com/macros/s/AKfycbwq6S0UJXOjaz8UoI5AQbukGXi_4kWrllPEqTOZMReJCRwmhzc91N7esrdWb8LZ8g8y/exec"
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          row = list(ws.iter_rows(values_only=True))[-1]

          payload = {
              "timestamp": row[0],
              "twinMember": row[1],
              "twinStandard": row[2],
              "kingMember": row[3],
              "kingStandard": row[4],
              "lowestPrice": row[5],
              "lowestRoom": row[6],
              "lowestRateType": row[7],
          }

          data = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          print("Google Sheet response:", result)
          if not result.get("success"):
              raise SystemExit("Google Sheet sync failed: " + str(result))

          print("Latest Taj price synced to Google Sheet.")
          PY

      - name: Send scheduled and price-change Telegram alerts
        env:
          TAJ_TELEGRAM_BOT_TOKEN: ${{ secrets.TAJ_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from openpyxl import load_workbook

          path = "Taj_Price_History.xlsx"
          wb = load_workbook(path, read_only=True, data_only=True)
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))

          if len(rows) < 2:
              print("No price row available for Telegram.")
              raise SystemExit(0)

          current = rows[-1]
          previous = rows[-2] if len(rows) >= 3 else None

          token = os.environ.get("TAJ_TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("TAJ_TELEGRAM_BOT_TOKEN is not configured.")

          chat_id = "348797661"
          url = "https://api.telegram.org/bot" + token + "/sendMessage"

          def send(message, count):
              for i in range(count):
                  data = urllib.parse.urlencode({
                      "chat_id": chat_id,
                      "text": message
                  }).encode("utf-8")
                  req = urllib.request.Request(url, data=data, method="POST")
                  with urllib.request.urlopen(req, timeout=20) as response:
                      response.read()
                  print(f"Telegram message {i + 1}/{count} sent.")
                  if i < count - 1:
                      time.sleep(1)

          lowest = int(float(current[5]))
          labels = [
              ("🛏 Twin Member", current[1]),
              ("🛏 Twin Standard", current[2]),
              ("🛏 King Member", current[3]),
              ("🛏 King Standard", current[4]),
          ]

          changed = False
          crossed_8000 = False
          if previous is not None:
              changed = tuple(previous[1:5]) != tuple(current[1:5])
              try:
                  crossed_8000 = float(previous[5]) >= 8000 and float(current[5]) < 8000
              except (TypeError, ValueError):
                  crossed_8000 = False

          # Priority 1: crossing from >= ₹8,000 to < ₹8,000 -> 20 messages.
          if crossed_8000:
              message = (
                  "🚨🚨 TAJ ₹8,000 CROSS ALERT 🚨🚨\n\n"
                  "🏨 Taj City Centre Gurugram\n"
                  "📅 25 Dec 2026 → 26 Dec 2026\n"
                  "👤 1 Guest | 1 Room\n\n"
                  f"💰 LOWEST PRICE: ₹{lowest:,}\n"
                  "🔥 PRICE CROSSED BELOW ₹8,000!\n"
                  f"🕐 {current[0]}"
              )
              send(message, 20)

          # Priority 2: any price change up or down -> 5 messages.
          elif changed:
              message = (
                  "🚨 TAJ PRICE CHANGE\n\n"
                  f"💰 LOWEST PRICE: ₹{lowest:,}\n\n"
                  "🏨 Taj City Centre Gurugram\n"
                  "📅 25 Dec 2026 → 26 Dec 2026\n"
                  "👤 1 Guest | 1 Room\n\n"
              )
              for label, value in labels:
                  if value is not None:
                      message += f"{label}: ₹{int(float(value)):,}\n"
              message += f"🕐 {current[0]}"
              send(message, 5)

          # Priority 3: exactly one normal scheduled message at 09:00, 13:00,
          # 17:00 and 21:00 India time. The workflow runs every 30 minutes;
          # these four hours occur at minute 00 in IST.
          now_ist = datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)
          scheduled_hours = {9, 13, 17, 21}
          if now_ist.hour in scheduled_hours and now_ist.minute == 0:
              message = (
                  "💰 TAJ PRICE UPDATE\n\n"
                  f"💰 LOWEST PRICE: ₹{lowest:,}\n\n"
                  "🏨 Taj City Centre Gurugram\n"
                  "📅 25 Dec 2026 → 26 Dec 2026\n"
                  "👤 1 Guest | 1 Room\n\n"
              )
              for label, value in labels:
                  if value is not None:
                      message += f"{label}: ₹{int(float(value)):,}\n"
              message += f"🕐 {current[0]}"
              send(message, 1)

          print("Telegram alert processing complete.")
          PY

      - name: Export Taj Excel history to CSV
        run: |
          python - <<'PY'
          import csv
          from openpyxl import load_workbook
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          with open("Taj_Price_History.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  writer.writerow(row)
          PY

      - name: Commit Taj price history
        if: always()
        run: |
          if [ ! -f Taj_Price_History.xlsx ]; then
            echo "No Taj Excel history created; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Taj_Price_History.xlsx Taj_Price_History.csv .taj_timestamps_ist_migrated
          git diff --cached --quiet && exit 0
          git commit -m "Add Taj special price alert"
          git pull --rebase origin main
          git push
