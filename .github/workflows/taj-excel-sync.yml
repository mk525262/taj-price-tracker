name: Taj Excel History Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/taj-excel-sync.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: taj-excel-sync
  cancel-in-progress: false

jobs:
  sync-taj-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Taj check for Excel only
        run: xvfb-run -a python taj_tracker.py

      - name: Export Taj Excel history to CSV
        run: |
          python - <<'PY'
          import csv
          from openpyxl import load_workbook
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          with open("Taj_Price_History.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  writer.writerow(row)
          PY

      - name: Commit Taj price history
        if: always()
        run: |
          if [ ! -f Taj_Price_History.xlsx ]; then
            echo "No Taj Excel history created; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Taj_Price_History.xlsx Taj_Price_History.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update Taj price history"
          git pull --rebase origin main
          git push
