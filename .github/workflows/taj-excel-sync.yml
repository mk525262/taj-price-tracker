name: Taj Excel History Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/taj-excel-sync.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: taj-excel-sync
  cancel-in-progress: false

jobs:
  sync-taj-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Taj check for price history
        run: xvfb-run -a python taj_tracker.py

      - name: Convert Taj timestamps to India time
        run: python taj_timezone_migration.py

      - name: Sync latest Taj price to Google Sheet
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from openpyxl import load_workbook

          webhook = "https://script.google.com/macros/s/AKfycbwq6S0UJXOjaz8UoI5AQbukGXi_4kWrllPEqTOZMReJCRwmhzc91N7esrdWb8LZ8g8y/exec"
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          row = list(ws.iter_rows(values_only=True))[-1]

          payload = {
              "timestamp": row[0],
              "twinMember": row[1],
              "twinStandard": row[2],
              "kingMember": row[3],
              "kingStandard": row[4],
              "lowestPrice": row[5],
              "lowestRoom": row[6],
              "lowestRateType": row[7],
          }

          data = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))

          print("Google Sheet response:", result)
          if not result.get("success"):
              raise SystemExit("Google Sheet sync failed: " + str(result))

          print("Latest Taj price synced to Google Sheet.")
          PY

      - name: Alert only when price changes
        env:
          TAJ_TELEGRAM_BOT_TOKEN: ${{ secrets.TAJ_TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.parse
          import urllib.request
          from openpyxl import load_workbook

          path = "Taj_Price_History.xlsx"
          wb = load_workbook(path, read_only=True, data_only=True)
          ws = wb.active
          rows = list(ws.iter_rows(values_only=True))

          if len(rows) < 3:
              print("Not enough history rows for a price-change comparison.")
              raise SystemExit(0)

          previous = rows[-2]
          current = rows[-1]
          changed = tuple(previous[1:5]) != tuple(current[1:5])

          print("Previous:", previous[:5])
          print("Current :", current[:5])
          print("PRICE_CHANGED:", changed)

          if not changed:
              print("No price change. Telegram alert skipped.")
              raise SystemExit(0)

          token = os.environ.get("TAJ_TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("TAJ_TELEGRAM_BOT_TOKEN is not configured.")

          lowest_price = float(current[5])
          if lowest_price <= 9000:
              alert_count = 50
              message = "🚨🚨 TAJ SPECIAL PRICE ALERT 🚨🚨\n\n"
              message += "🏨 Taj City Centre Gurugram\n"
              message += "📅 25 Dec 2026 → 26 Dec 2026\n"
              message += "👤 1 Guest | 1 Room\n\n"
              message += f"💰 LOWEST PRICE: ₹{int(lowest_price):,}\n"
              message += "🔥 PRICE ₹9,000 OR BELOW!\n"
              message += f"🕐 {current[0]}\n"
          else:
              alert_count = 5
              labels = [
                  ("🛏 Twin Member", current[1]),
                  ("🛏 Twin Standard", current[2]),
                  ("🛏 King Member", current[3]),
                  ("🛏 King Standard", current[4]),
              ]
              message = "🚨 TAJ PRICE CHANGE\n\n"
              message += "🏨 Taj City Centre Gurugram\n"
              message += "📅 25 Dec 2026 → 26 Dec 2026\n"
              message += "👤 1 Guest | 1 Room\n\n"
              for label, value in labels:
                  message += f"{label}: ₹{int(value):,}\n"
              message += f"\n💰 Lowest Price: ₹{int(current[5]):,}\n"
              message += f"🕐 {current[0]}\n"

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          for i in range(alert_count):
              data = urllib.parse.urlencode({"chat_id": "348797661", "text": message}).encode("utf-8")
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req, timeout=20) as response:
                  response.read()
              print(f"Telegram alert {i + 1}/{alert_count} sent.")
              if i < alert_count - 1:
                  time.sleep(1)
          PY

      - name: Export Taj Excel history to CSV
        run: |
          python - <<'PY'
          import csv
          from openpyxl import load_workbook
          wb = load_workbook("Taj_Price_History.xlsx", read_only=True, data_only=True)
          ws = wb.active
          with open("Taj_Price_History.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  writer.writerow(row)
          PY

      - name: Commit Taj price history
        if: always()
        run: |
          if [ ! -f Taj_Price_History.xlsx ]; then
            echo "No Taj Excel history created; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Taj_Price_History.xlsx Taj_Price_History.csv .taj_timestamps_ist_migrated
          git diff --cached --quiet && exit 0
          git commit -m "Add Taj special price alert"
          git pull --rebase origin main
          git push
